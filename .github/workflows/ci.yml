# Quality gates for every pull request, every push to main, and the Android branches.
#
# Runs in a clean environment with no application secrets and only temporary databases. It
# does not deploy anything. Each gate is its own named step, so a red run says which one failed.
#
# Toolchain: Node 22 (see "engines" in package.json) and pnpm 10.33.0 (the "packageManager"
# field, which pnpm/action-setup reads).
name: CI

on:
  pull_request:
  push:
    # The Android work runs here before it is merged, so its own job is proven on GitHub's
    # runners (this environment cannot download the Android SDK).
    branches: [main, 'feature/android-app*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Quality gates and production artefact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Nothing here may reach a real service or a real database.
      CI: 'true'
    steps:
      - name: Define artifact directory
        shell: bash
        run: echo "ARTEFACT_DIR=$RUNNER_TEMP/seayou-api" >> "$GITHUB_ENV"

      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Caches only pnpm's content-addressed package store, keyed on the lockfile.
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The whole suite, once. It includes the fail-closed configuration tests and the
      # development-route security tests (apps/api/src/config.test.ts, http/dev-mode.test.ts).
      - name: Unit and integration tests
        run: pnpm test

      - name: Production builds (web and API)
        run: pnpm build

      # What would ship: the compiled API plus production dependencies only — no tsx, no
      # TypeScript, no source, no .env, no database.
      - name: Assemble the production-only API artefact
        run: pnpm --filter @mib/api deploy --prod --legacy "$ARTEFACT_DIR"

      - name: Fresh migration with the compiled migrator
        env:
          # The compiled artefact runs in production mode, which requires an https:// public
          # address. A reserved, non-routable placeholder: configuration input only; the
          # migrator never contacts it.
          MIB_APP_URL: https://ci.invalid
        run: |
          db="$RUNNER_TEMP/migrate-check/fresh.sqlite"
          mkdir -p "$(dirname "$db")"
          MIB_DATABASE_PATH="$db" node "$ARTEFACT_DIR/dist/migrate.js"
          # Idempotent: a second run applies nothing and still succeeds.
          MIB_DATABASE_PATH="$db" node "$ARTEFACT_DIR/dist/migrate.js"
          cd "$ARTEFACT_DIR" && node --input-type=module -e "
            import Database from 'better-sqlite3';
            import fs from 'node:fs';
            const expected = JSON.parse(fs.readFileSync('drizzle/meta/_journal.json', 'utf8')).entries.length;
            const db = new Database(process.argv[1], { readonly: true });
            const applied = db.prepare('select count(*) as n from __drizzle_migrations').get().n;
            console.log('migrations applied:', applied, 'expected:', expected);
            if (applied !== expected) process.exit(1);
          " "$db"

      # Starts node dist/server.js from the artefact against a temporary database and asserts:
      # startup refuses MIB_DEV_MODE=true; /api/health, /legal/* and /support answer; every
      # /api/dev/* route is 404; the seeded development accounts cannot sign in; register and
      # sign-in work; the audited reset-link takeover chain fails; SIGTERM stops it cleanly.
      - name: Production artefact smoke (dev endpoints absent, seeded credentials refused)
        run: node apps/api/scripts/smoke-artefact.mjs --artefact "$ARTEFACT_DIR" --prod-only

  android:
    name: Android debug build, lint and release guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Android Gradle Plugin 8 needs Java 17 or newer; the runner image provides the SDK.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The development interface (API origin http://10.0.2.2:3001), synced into the project.
      - name: Build and sync the interface for a debug build
        run: pnpm --filter @mib/web android:dev

      - name: Debug build and Android lint
        working-directory: apps/web/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug lintDebug

      # The release guard (verifySeaYouReleaseAssets) must refuse to package the development
      # assets synced above. No upload key exists here, so a release can never be produced.
      - name: The release build refuses development assets
        working-directory: apps/web/android
        run: |
          if ./gradlew --no-daemon bundleRelease > release.log 2>&1; then
            cat release.log
            echo "bundleRelease succeeded with development assets: the release guard is not wired"
            exit 1
          fi
          if ! grep -q "built in 'dev' mode" release.log; then
            cat release.log
            echo "bundleRelease failed, but not because of the release guard"
            exit 1
          fi
          echo "The release guard refused the development assets, as it must."
